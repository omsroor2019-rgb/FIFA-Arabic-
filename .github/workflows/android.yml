name: Validate and build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    # The godot-ci image installs its Android SDK, Java settings, and export
    # templates under /root. GitHub's container runner may override HOME;
    # keep HOME aligned with the image so Godot can find those files.
    env:
      HOME: /root
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android export environment
        shell: bash
        run: |
          set -euo pipefail

          apt-get update -qq
          apt-get install -y -qq --no-install-recommends fontconfig

          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"

          # Ensure the exact Godot 4.7.2 templates are available. The image
          # normally includes them; this fallback repairs a missing install.
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          if [[ ! -s "$TEMPLATE_DIR/android_debug.apk" || ! -s "$TEMPLATE_DIR/android_release.apk" ]]; then
            wget -q "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" -O /tmp/godot-templates.tpz
            mkdir -p /tmp/godot-templates
            unzip -oq /tmp/godot-templates.tpz -d /tmp/godot-templates
            cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
            printf '4.7.2.stable\n' > "$TEMPLATE_DIR/version.txt"
          fi

          # Make the required SDK/JDK paths explicit in Godot's 4.7 editor settings.
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          # Create a temporary DEBUG signing key for installable test APKs.
          # This key is only for development/testing; do not use it for Google Play release builds.
          if [[ ! -s /root/debug.keystore ]]; then
            keytool -genkeypair -v \
              -keystore /root/debug.keystore \
              -storetype JKS \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Verify the components before trying to export.
          test -x "$JAVA_HOME/bin/java"
          test -x "$JAVA_HOME/bin/keytool"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"
          test -s /root/debug.keystore
          godot --version
          java -version
          keytool -list -keystore /root/debug.keystore -storepass android -alias androiddebugkey

          # Update SDK packages to the versions documented for Godot 4.7.
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Import and validate project
        run: godot --headless --editor --path . --quit

      - name: Run scene smoke test
        run: godot --headless --path . --quit-after 8

      - name: Verify Android texture compression setting
        run: |
          grep -F 'textures/vram_compression/import_etc2_astc=true' project.godot

      - name: Export and verify signed Android APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/fifa-arabic-android.apk
          test -s build/fifa-arabic-android.apk

          # Verify that Android can authenticate the generated APK before uploading it.
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"
          "$ZIPALIGN" -c -v 4 build/fifa-arabic-android.apk
          "$APKSIGNER" verify --verbose --print-certs build/fifa-arabic-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fifa-arabic-android
          path: build/fifa-arabic-android.apk
          if-no-files-found: error
